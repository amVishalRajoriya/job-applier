{% extends "base.html" %}{% block title %}Log in{% endblock %}{% block body %}
<section style="max-width:360px;margin:40px auto"><h2 style="margin-top:0">Log in</h2>
<p class="muted">Enter the dashboard password (the <code>JOBAGENT_DASHBOARD_TOKEN</code> you set on the host).</p>
{% if err %}<p class="bad">Wrong password.</p>{% endif %}
<form method="post" action="/login"><input type="hidden" name="next" value="{{ next }}">
<input type="password" name="password" autofocus required style="width:100%;box-sizing:border-box;margin-bottom:10px">
<button style="width:100%">Log in</button></form></section>{% endblock %}
